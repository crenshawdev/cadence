# sentinel fast check, on every pull request and every push to main, and the
# review of a pull request from a fork when started by hand.
#
# Copy this file into .github/workflows/ (GitHub) or .forgejo/workflows/
# (Forgejo) in the repo under audit. It expects sentinel as a git submodule at
# the path in SENTINEL_DIR.
#
# The mechanical job runs on both GitHub and Forgejo, on pull requests, on
# pushes to main, and once a week on main, so a new advisory against a
# dependency already in use shows up without waiting for a pull request. The
# review jobs run on GitHub only, because they post through the GitHub API,
# and a job skipped by its `if:` never downloads its actions.
#
# The required `security-review` check is posted by the review jobs once a
# review has passed. A pull request from this repository is reviewed by
# itself. A pull request from a fork gets no Actions secrets, so it is not
# reviewed until someone with write access reviews it from main's copy of
# this workflow:
#
#   gh workflow run fast.yml -f pr=<pull request number>
#
# That run reads the fork's code and never runs it, so the API key never meets
# code the fork controls, and only a run started from the default branch can
# review.
#
# A fork's pull request runs the fork's copy of the workflows, so it can add a
# job named security-review of its own. To keep that from passing the check,
# set the repository variable SENTINEL_APP_CLIENT_ID and the secret
# SENTINEL_APP_PRIVATE_KEY (as an Actions and a Dependabot secret) for a
# GitHub App of yours with write access to checks, and require the check from
# that app in the ruleset. The review jobs then post it as the app, which a
# fork's job cannot. Without the variable they post it as GitHub Actions.
#
# On a public repo, set the repository variable SENTINEL_REVIEW_AGE_RECIPIENT
# to your age public key. The review is then encrypted and uploaded as the
# `security-review` artifact, and the comment, log and job summary show only
# the count of findings. `.sentinel/ci/read-review.sh <pull request number>`
# decrypts it on your machine. Without the variable the whole review is posted.
name: sentinel-fast

on:
  pull_request:
  # A push straight to main gets the mechanical checks too.
  push:
    branches: [main]
  # Mondays at 06:17 UTC, mechanical checks only: the review job's `if:` keeps
  # it to pull requests.
  schedule:
    - cron: '17 6 * * 1'
  # The review of a pull request from a fork, started by hand.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

env:
  SENTINEL_DIR: .sentinel

# A newer push to the same pull request cancels the review of the older one,
# so two pushes a minute apart do not pay for two reviews. Runs on main queue
# instead, so none is lost, and so do reviews started by hand, one queue per
# pull request.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mechanical:
    # A review started by hand runs on main, which pushes already check.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # gitleaks reads every commit, so fetch the whole history.
          fetch-depth: 0
          # Builds run the pull request's code; keep the token out of .git/config.
          persist-credentials: false
      - name: Install check tools
        run: '"$SENTINEL_DIR/ci/install-tools.sh"'
      - name: Mechanical checks
        run: '"$SENTINEL_DIR/mechanical/check.sh" .'

  review:
    # Pull requests from this repository only. A pull request from a fork
    # gets no Actions secrets, so the review could never run on it; review-pr
    # reviews it when started by hand. Dependabot's get no secrets either; the
    # dependabot job marks them. There is no `needs: mechanical`, so a failing
    # gate, such as a new advisory against a dependency already in use, does
    # not skip the review.
    if: github.event_name == 'pull_request' && github.server_url == 'https://github.com' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          # The reviewer can read files; keep the token out of .git/config.
          persist-credentials: false
      # Claude Code needs Node 22 or newer; older Node gets an old CLI that
      # cannot run current models.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The version is pinned. A global npm install has no lockfile, which is
      # what zizmor's adhoc-packages audit looks for.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.300 # zizmor: ignore[adhoc-packages]
      - name: Install age
        if: vars.SENTINEL_REVIEW_AGE_RECIPIENT != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Review the diff
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
          SENTINEL_REVIEW_AGE_RECIPIENT: ${{ vars.SENTINEL_REVIEW_AGE_RECIPIENT }}
        run: '"$SENTINEL_DIR/ci/security-review.sh" "origin/$BASE_REF"'
      - name: Upload the encrypted review
        if: ${{ !cancelled() && hashFiles('security-review.md.age') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-review
          path: security-review.md.age
          retention-days: 14
      # One comment per pull request, rewritten on each push, so a stale
      # review never sits above the current one. --edit-last edits the last
      # comment github-actions left, which is this one unless another
      # workflow comments with the same token.
      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file security-review.md --edit-last --create-if-none
      # The required check. It is posted only after a review passed: a failed
      # check of the same name would keep blocking the commit after a later
      # pass. Its external_id names this run, which read-review.sh reads.
      # As the review app when one is set up, so a fork's own job named
      # security-review cannot stand in for this check.
      - name: Get the review app's token
        id: app
        if: vars.SENTINEL_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SENTINEL_APP_CLIENT_ID }}
          private-key: ${{ secrets.SENTINEL_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Mark the commit reviewed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --silent
          -f name=security-review -f head_sha="$SHA" -f status=completed -f conclusion=success
          -f external_id="$GITHUB_RUN_ID"
          -f "output[title]=Reviewed"
          -f "output[summary]=Reviewed by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  dependabot:
    # Dependabot's pull requests get no Actions secrets, so they are not
    # reviewed; their dependency changes go through the mechanical job's
    # checks. The required check is marked skipped, which lets them merge.
    # The run has to be Dependabot's own: a push to its branch by anyone
    # else goes unmarked. The actor test only narrows the author test, so
    # zizmor's spoofing concern cannot widen who gets through.
    if: github.event_name == 'pull_request' && github.server_url == 'https://github.com' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' # zizmor: ignore[bot-conditions]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      # As the review app when one is set up, so a fork's own job named
      # security-review cannot stand in for this check.
      - name: Get the review app's token
        id: app
        if: vars.SENTINEL_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SENTINEL_APP_CLIENT_ID }}
          private-key: ${{ secrets.SENTINEL_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Mark the commit not reviewed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --silent
          -f name=security-review -f head_sha="$SHA" -f status=completed -f conclusion=skipped
          -f "output[title]=Not reviewed"
          -f "output[summary]=Dependabot pull requests are not reviewed; the mechanical job checks their dependencies."

  review-pr:
    # A pull request from a fork, reviewed when someone with write access
    # starts it by hand. The workflow and the kit come from the default
    # branch, never from the pull request, and the pull request's code is
    # only read: nothing in it runs, and its submodules are not fetched.
    if: github.event_name == 'workflow_dispatch' && github.server_url == 'https://github.com' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false
      # A symlink in the pull request could point the review's reads or
      # writes outside its tree, at main's kit or /proc/self/environ. The
      # diff is built from the commits, so it still shows any it adds.
      - name: Remove the pull request's symlinks
        run: find pr -path pr/.git -prune -o -type l -exec rm -f {} +
      # The commit marked is the one checked out, so a push during the review
      # leaves the new head unmarked.
      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          base=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json baseRefName -q .baseRefName)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C pr rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.300 # zizmor: ignore[adhoc-packages]
      - name: Install age
        if: vars.SENTINEL_REVIEW_AGE_RECIPIENT != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      # The script is main's; its working directory is the pull request's
      # tree, so the reviewer reads that tree and nothing outside it.
      - name: Review the diff
        working-directory: pr
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: ${{ steps.pr.outputs.base }}
          SENTINEL_REVIEW_AGE_RECIPIENT: ${{ vars.SENTINEL_REVIEW_AGE_RECIPIENT }}
        run: '"$GITHUB_WORKSPACE/$SENTINEL_DIR/ci/security-review.sh" "origin/$BASE_REF"'
      - name: Upload the encrypted review
        if: ${{ !cancelled() && hashFiles('pr/security-review.md.age') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-review
          path: pr/security-review.md.age
          retention-days: 14
      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file pr/security-review.md --edit-last --create-if-none
      # As the review app when one is set up, so a fork's own job named
      # security-review cannot stand in for this check.
      - name: Get the review app's token
        id: app
        if: vars.SENTINEL_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SENTINEL_APP_CLIENT_ID }}
          private-key: ${{ secrets.SENTINEL_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Mark the commit reviewed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --silent
          -f name=security-review -f head_sha="$SHA" -f status=completed -f conclusion=success
          -f external_id="$GITHUB_RUN_ID"
          -f "output[title]=Reviewed"
          -f "output[summary]=Reviewed by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
