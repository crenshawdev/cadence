name: release

# A tag is the trigger, so publishing is a consequence of tagging rather than a
# separate thing to remember. Thirty tags between v2.3.0 and v3.7.1 shipped with
# no release attached because nothing here watched for them.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    # A tag is a movable pointer, and the `protect-release-tags` ruleset
    # (id 19145547) carries `deletion`, `update` and `non_fast_forward` - none
    # of which says WHERE a new tag may point. `test.yml` fires on `push` to main
    # and on `pull_request`, never on tags. So until this job existed,
    # `git tag v9.9.9 <any-sha> && git push origin v9.9.9` published an official
    # release from a commit no CI had ever seen. Two conditions, both required:
    # the tagged commit is ON main, and the suite is green for that exact SHA.
    # Reachability alone is not enough (a red commit can sit on main); a green
    # suite alone is not enough (any SHA can be made green in a fork).
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 for two reasons: the reachability test below walks
      # history, and `why-record.test.mjs` reads this repository's own log (not
      # the tests repository's) as its fixture corpus and fails 23 arms on a
      # depth-1 checkout. The step after it clones the cadence-tests repository
      # into tests/, where the suite runs from, at the commit .github/tests-pin
      # names (a plain clone, not a submodule - see test.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Clone the suite at the pinned commit
        run: |
          set -euo pipefail
          PIN="$(cat .github/tests-pin)"
          if ! [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/tests-pin must hold one full 40-character commit SHA"
            exit 1
          fi
          git clone --quiet https://github.com/crenshawdev/cadence-tests tests
          git -C tests checkout --quiet --detach "$PIN"

      - name: The tagged commit is reachable from main
        run: |
          set -euo pipefail
          SHA="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${SHA}, which is not reachable from origin/main - a release must be cut from a commit that landed on main"
            exit 1
          fi
          echo "${SHA} is on main"

      # The same condition for the suite itself. The pin is one SHA in
      # .github/tests-pin, so a diff shows only two SHAs, and nothing about a
      # SHA says which branch it came from, which lets a pin name a suite that
      # never landed on cadence-tests' main (any SHA can be made green in a
      # fork or on a side branch). Read the pin from the tagged commit's tree
      # and require it to be reachable from cadence-tests' main, as the tag is
      # from ours.
      - name: The pinned tests commit is reachable from cadence-tests main
        run: |
          set -euo pipefail
          PIN="$(git show "${GITHUB_SHA}:.github/tests-pin")"
          git -C tests fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git -C tests merge-base --is-ancestor "$PIN" refs/remotes/origin/main; then
            echo "::error::tests is pinned to ${PIN}, which is not reachable from cadence-tests main - a release must run a suite that landed on main"
            exit 1
          fi
          echo "${PIN} is on cadence-tests main"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The zero-dep gates, run against the tagged SHA itself rather than
      # trusted from whatever `test.yml` did on some other commit. The suite
      # is the cadence-tests commit that SHA's .github/tests-pin names. `typecheck`
      # is deliberately not duplicated here: it needs an ephemeral `npm install`
      # and so is the one arm of test.yml this gate does not reproduce.
      - run: node tests/test.mjs
      - run: node cadence-core/bin/self-verify.mjs

  publish:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      # Scoped to this job alone; the workflow default above stays read-only.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag and plugin manifest agree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          MANIFEST="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$VER" != "$MANIFEST" ]; then
            echo "::error::tag ${TAG} claims ${VER}, .claude-plugin/plugin.json says ${MANIFEST}"
            exit 1
          fi
          echo "version ${VER} agrees"

      - name: Slice the CHANGELOG section for this version
        id: notes
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one, minus
          # the link-reference block Keep a Changelog puts at the foot.
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f && !/^\[[^]]+\]: *http/ { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md carries no section for ${VER}"
            exit 1
          fi
          echo "wrote $(wc -l < RELEASE_NOTES.md) lines of notes"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # An -rc tag publishes as a pre-release and never takes Latest.
          case "$TAG" in
            *-rc.*|*-alpha*|*-beta*) FLAGS="--prerelease --latest=false" ;;
            *)                       FLAGS="--latest" ;;
          esac
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag $FLAGS
