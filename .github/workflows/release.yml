name: release

# Tagging is the trigger, so nobody has to remember to publish. Thirty tags between
# v2.3.0 and v3.7.1 shipped with no release because nothing here watched for them.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    # A tag is a movable pointer, and the `protect-release-tags` ruleset doesn't say where one
    # may point. test.yml never runs on tags, so any SHA could be tagged and published.
    # Two things have to hold: the commit is on main, and the suite is green for that exact SHA.
    # Either alone isn't enough: a red commit can sit on main, and any SHA can go green in a fork.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the reachability test walks history, and why-record.test.mjs reads
      # this repo's own log and fails 23 arms on a depth-1 checkout.
      # tests/ is a plain clone of cadence-tests at the .github/tests-pin commit, not a submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Clone the suite at the pinned commit
        run: |
          set -euo pipefail
          PIN="$(cat .github/tests-pin)"
          if ! [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/tests-pin must hold one full 40-character commit SHA"
            exit 1
          fi
          git clone --quiet https://github.com/crenshawdev/cadence-tests tests
          git -C tests checkout --quiet --detach "$PIN"

      - name: The tagged commit is reachable from main
        run: |
          set -euo pipefail
          SHA="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${SHA}, which is not reachable from origin/main - a release must be cut from a commit that landed on main"
            exit 1
          fi
          echo "${SHA} is on main"

      # Same rule for the suite. A pin is just a SHA and says nothing about which branch it came from,
      # so read it from the tagged commit and require it to be reachable from cadence-tests main.
      - name: The pinned tests commit is reachable from cadence-tests main
        run: |
          set -euo pipefail
          PIN="$(git show "${GITHUB_SHA}:.github/tests-pin")"
          git -C tests fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git -C tests merge-base --is-ancestor "$PIN" refs/remotes/origin/main; then
            echo "::error::tests is pinned to ${PIN}, which is not reachable from cadence-tests main - a release must run a suite that landed on main"
            exit 1
          fi
          echo "${PIN} is on cadence-tests main"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Run the gates against the tagged SHA itself, not whatever test.yml did on some other commit.
      # typecheck is left out on purpose: it needs an ephemeral npm install.
      - run: node tests/test.mjs
      - run: node cadence-core/bin/self-verify.mjs

  publish:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      # Only this job writes; the workflow default stays read-only.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag and plugin manifest agree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          MANIFEST="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$VER" != "$MANIFEST" ]; then
            echo "::error::tag ${TAG} claims ${VER}, .claude-plugin/plugin.json says ${MANIFEST}"
            exit 1
          fi
          echo "version ${VER} agrees"

      - name: Slice the CHANGELOG section for this version
        id: notes
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # This version's section, minus the link block Keep a Changelog puts at the foot.
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f && !/^\[[^]]+\]: *http/ { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md carries no section for ${VER}"
            exit 1
          fi
          echo "wrote $(wc -l < RELEASE_NOTES.md) lines of notes"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # -rc, -alpha and -beta tags publish as pre-releases and never take Latest.
          case "$TAG" in
            *-rc.*|*-alpha*|*-beta*) FLAGS="--prerelease --latest=false" ;;
            *)                       FLAGS="--latest" ;;
          esac
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag $FLAGS
