name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Node matrix and the typecheck job are gone, not disabled. They ran the
  # 3.x suite in cadence-core/ against a tree the 4.0 binary renders, and had
  # been red since 2026-09-13 on a citation a rendered skill stopped carrying
  # in phase 13. There is no further 3.x work; the 3.x branch is that suite's
  # home, and cadence-core/ leaves this branch surface by surface as the binary
  # replaces it. Until it does, the frozen-reference step below is the only
  # thing that still needs to know it exists.
  cargo-test:
    # The Rust binary is the product. This is the suite.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not tidiness. Sixteen tests read the
      # frozen reference straight out of git - `git show v3.7.12:<path>` in
      # config/tests.rs and import/tests.rs, and `git archive v3.7.12` for the
      # .planning extraction fixture. A shallow checkout has no tags, so every
      # one of them fails with "fatal: not a valid object name: v3.7.12" while
      # passing locally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installed by name, not left to rustup's auto-install: rustup 1.28
      # stopped installing the toolchain a rust-toolchain.toml names on first
      # use, so a job that only ran `cargo` would fail on the runner image
      # rather than build against the pinned compiler.
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          set -euo pipefail
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$CHANNEL" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          rustup toolchain install "$CHANNEL" --profile minimal
          rustup default "$CHANNEL"
          rustc --version

      # --locked on both, because a committed Cargo.lock is the whole of what
      # "builds offline" means here and an unlocked resolve would quietly test
      # a dependency graph no commit records.
      - run: cargo build --locked
      - run: cargo test --locked

      # The frozen reference guard, and now the ONLY one running in CI: the
      # self-verify job that used to lint the shipped tree was removed under
      # D-29. Every 4.0 plan asserts this locally in its Verify block; asserting
      # it here too means a change to cadence-core/ cannot reach main unnoticed
      # just because nobody ran a plan. Exact and instant, where the v3 test
      # suite was a slow and weaker proxy for the same property.
      - name: The frozen v3 reference is byte-identical to its tag
        run: git diff --exit-code v3.7.12 -- cadence-core/

