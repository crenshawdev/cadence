name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    # One job per GROUP, so a red arm names the seam that broke and the arms
    # run in parallel. The groups are declared in test.mjs in the cadence-tests
    # repository, mounted at tests/; anything it does not name lands in
    # `other`, which is in this matrix, so a new test file is never silently
    # unrun.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        group: [routing, git, planning, prose, review, other]
    steps:
      # fetch-depth: 0, not the default shallow depth-1. `why-record.test.mjs`
      # (the `other` group) reads THIS repository's own history, not the tests
      # repository's, as its fixture corpus - archived SUMMARY tables joined to
      # the commits they name - so a depth-1 checkout fails 23 of its arms with
      # `invalid object name <sha>^`. The step after it clones the cadence-tests
      # repository into tests/ at the commit .github/tests-pin names; only this
      # job and coverage need it. It is a plain clone, not a submodule: the
      # plugin directory refuses a submodule set to `update = none`, and without
      # that setting a plugin install pulls the suite into the user's plugin
      # cache. The other jobs below, apart from coverage, walk no history, keep
      # the shallow default and clone no suite, so they see the tree a GitHub
      # install receives.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Clone the suite at the pinned commit
        run: |
          set -euo pipefail
          PIN="$(cat .github/tests-pin)"
          if ! [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/tests-pin must hold one full 40-character commit SHA"
            exit 1
          fi
          git clone --quiet https://github.com/crenshawdev/cadence-tests tests
          git -C tests checkout --quiet --detach "$PIN"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Zero-dep repo: no install step, the built-in runner is the framework.
      - run: node tests/test.mjs ${{ matrix.group }}

  coverage:
    # The whole suite in one run with Node's built-in coverage, written as LCOV
    # for SonarQube. The scan runs in this job after the report is written, so
    # no artifact passes between jobs. node --test runs the files directly
    # because test.mjs passes no runner flags through; the env line does what
    # test.mjs does, pointing the suite at a user-global config that does not
    # exist. Node 26, because --test-coverage-include-all needs Node 26.7 or
    # later; it counts files no test loads, and the two guards after the run
    # catch an empty scope and a file that was never loaded. fetch-depth: 0 because why-record.test.mjs reads this repository's
    # history (see node-test), and the scan uses blame to find new code.
    # persist-credentials: false keeps the job token out of .git/config, where
    # the scan action could read it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Clone the suite at the pinned commit
        run: |
          set -euo pipefail
          PIN="$(cat .github/tests-pin)"
          if ! [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/tests-pin must hold one full 40-character commit SHA"
            exit 1
          fi
          git clone --quiet https://github.com/crenshawdev/cadence-tests tests
          git -C tests checkout --quiet --detach "$PIN"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Run the suite with coverage
        env:
          CADENCE_GLOBAL_CONFIG: ${{ runner.temp }}/no-global/config.json
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include-all
          --test-coverage-include='cadence-core/**'
          --test-coverage-exclude='tests/**'
          --test-coverage-lines=95 --test-coverage-branches=88
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          tests/*.test.mjs

      - name: Guard against an empty coverage scope
        run: |
          grep -q '^LF:[1-9]' lcov.info

      - name: Guard against a file the suite never loaded
        run: |
          ! grep -qx 'LH:0' lcov.info

      # Forks and Dependabot runs don't get the secret, so they skip the scan.
      - name: Check for SonarQube token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache SonarQube packages
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  self-verify:
    # The prose<->code drift linter: every config key, script invocation, and
    # plugin-root path named in the live prose must exist in the code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node cadence-core/bin/self-verify.mjs

  typecheck:
    # Honor the @ts-check pragmas. The repo has no package.json; typescript +
    # @types/node are installed ephemerally for this job only (tsconfig.ci.json),
    # pinned to exact versions that move by hand: .github/dependabot.yml carries
    # no npm ecosystem and there is no manifest for it to read.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts typescript@7.0.2 @types/node@26.6.5
      - run: node_modules/.bin/tsc -p tsconfig.ci.json

  plugin-validate:
    # The host's own validator over both manifests, strict, so a check Claude
    # Code tightens fails here before it fails someone's install. Then the
    # plugin is added from this checkout as a marketplace, installed, and its
    # installed config.mjs launched from outside the checkout, with no secret
    # or credential in any step: the plugin runs as a user receives it. The CLI
    # is pinned to the only version those commands were tried on; the pin moves
    # by hand, since .github/dependabot.yml carries no npm ecosystem and the
    # repository has no package.json. An unpinned global install has no lockfile, which is what
    # zizmor's adhoc-packages audit looks for. --ignore-scripts keeps every
    # package's install script from running; Claude Code's own script only links
    # its native binary into place, so we run that one by name.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install -g --ignore-scripts @anthropic-ai/claude-code@2.1.318 # zizmor: ignore[adhoc-packages]
      - run: npm explore -g @anthropic-ai/claude-code -- node install.cjs
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict .claude-plugin/plugin.json
      - run: claude plugin marketplace add ./
      - run: claude plugin install cadence@cadence
      - name: Launch the installed plugin from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          INSTALL="$(claude plugin list --json | node -e "const rows = JSON.parse(require('fs').readFileSync(0, 'utf8')); const row = rows.find((r) => r.id === 'cadence@cadence'); if (!row) { console.error('cadence@cadence is not installed'); process.exit(1); } process.stdout.write(row.installPath);")"
          OUT="$(node "$INSTALL/cadence-core/bin/config.mjs" get workflow.plan_check)"
          echo "$OUT"
          echo "$OUT" | node -e "process.exit(JSON.parse(require('fs').readFileSync(0, 'utf8')).ok === true ? 0 : 1)"
