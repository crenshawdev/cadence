name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    # One job per GROUP, so a red arm names the seam that broke and the arms
    # run in parallel. The groups are declared in cadence-core/bin/test.mjs;
    # anything it does not name lands in `other`, which is in this matrix, so a
    # new test file is never silently unrun.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        group: [routing, git, planning, prose, review, other]
    steps:
      # fetch-depth: 0, not the default shallow depth-1. `why-record.test.mjs`
      # (the `other` group) reads THIS repository's own history as its fixture
      # corpus - archived SUMMARY tables joined to the commits they name - so a
      # depth-1 checkout fails 23 of its arms with `invalid object name <sha>^`.
      # The other jobs below walk no history and keep the shallow default.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Zero-dep repo: no install step, the built-in runner is the framework.
      - run: node cadence-core/bin/test.mjs ${{ matrix.group }}

  self-verify:
    # The prose<->code drift linter: every config key, script invocation, and
    # plugin-root path named in the live prose must exist in the code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node cadence-core/bin/self-verify.mjs

  typecheck:
    # Honor the @ts-check pragmas. The repo has no package.json; typescript +
    # @types/node are installed ephemerally for this job only (tsconfig.ci.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock typescript @types/node
      - run: npx tsc -p tsconfig.ci.json

  cargo-test:
    # The Rust binary the 4.0.0 rewrite is moving into, built and tested beside
    # the Node matrix rather than instead of it: both halves ship for now.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not tidiness. Sixteen tests read the
      # frozen reference straight out of git - `git show v3.7.12:<path>` in
      # config/tests.rs and import/tests.rs, and `git archive v3.7.12` for the
      # .planning extraction fixture. A shallow checkout has no tags, so every
      # one of them fails with "fatal: not a valid object name: v3.7.12" while
      # passing locally. The node-test job already fetches full history for the
      # same reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installed by name, not left to rustup's auto-install: rustup 1.28
      # stopped installing the toolchain a rust-toolchain.toml names on first
      # use, so a job that only ran `cargo` would fail on the runner image
      # rather than build against the pinned compiler.
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          set -euo pipefail
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          if [ -z "$CHANNEL" ]; then
            echo "::error::rust-toolchain.toml names no channel"
            exit 1
          fi
          rustup toolchain install "$CHANNEL" --profile minimal
          rustup default "$CHANNEL"
          rustc --version

      # --locked on both, because a committed Cargo.lock is the whole of what
      # "builds offline" means here and an unlocked resolve would quietly test
      # a dependency graph no commit records.
      - run: cargo build --locked
      - run: cargo test --locked

