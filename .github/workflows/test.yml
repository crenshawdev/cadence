name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    # One job per group, so a red arm names the seam that broke. The groups live in test.mjs in
    # cadence-tests; anything it doesn't name lands in `other`, which is in the matrix.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        group: [routing, git, planning, prose, review, other]
    steps:
      # fetch-depth: 0 because why-record.test.mjs (the `other` group) reads this repo's own history
      # and fails 23 arms on a depth-1 checkout. tests/ is a plain clone of cadence-tests at the
      # .github/tests-pin commit, not a submodule: the plugin dir refuses one set to `update = none`,
      # and without that setting a plugin install pulls the suite into the user's cache.
      # Only this job and coverage need it; the others keep the shallow default.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Clone the suite at the pinned commit
        run: |
          set -euo pipefail
          PIN="$(cat .github/tests-pin)"
          if ! [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/tests-pin must hold one full 40-character commit SHA"
            exit 1
          fi
          git clone --quiet https://github.com/crenshawdev/cadence-tests tests
          git -C tests checkout --quiet --detach "$PIN"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Zero-dep repo, so no install step.
      - run: node tests/test.mjs ${{ matrix.group }}

  coverage:
    # The whole suite in one run with Node's coverage, written as LCOV for SonarQube. The scan runs
    # in this job so no artifact has to pass between jobs.
    # node --test runs the files directly because test.mjs passes no runner flags through, so the
    # env line does test.mjs's job and points the suite at a user-global config that doesn't exist.
    # Node 26 because --test-coverage-include-all needs 26.7; it counts files no test loads, and the
    # two guards catch an empty scope and a file that never loaded.
    # fetch-depth: 0 for why-record.test.mjs and for the scan's blame.
    # persist-credentials: false keeps the job token out of .git/config, where the scan action could read it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Clone the suite at the pinned commit
        run: |
          set -euo pipefail
          PIN="$(cat .github/tests-pin)"
          if ! [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/tests-pin must hold one full 40-character commit SHA"
            exit 1
          fi
          git clone --quiet https://github.com/crenshawdev/cadence-tests tests
          git -C tests checkout --quiet --detach "$PIN"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Run the suite with coverage
        env:
          CADENCE_GLOBAL_CONFIG: ${{ runner.temp }}/no-global/config.json
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include-all
          --test-coverage-include='cadence-core/**'
          --test-coverage-exclude='tests/**'
          --test-coverage-lines=95 --test-coverage-branches=88
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          tests/*.test.mjs

      - name: Guard against an empty coverage scope
        run: |
          grep -q '^LF:[1-9]' lcov.info

      - name: Guard against a file the suite never loaded
        run: |
          ! grep -qx 'LH:0' lcov.info

      # Forks and Dependabot runs don't get the secret, so they skip the scan.
      - name: Check for SonarQube token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache SonarQube packages
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  self-verify:
    # Prose/code drift: every config key, script call and plugin-root path named in prose has to exist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node cadence-core/bin/self-verify.mjs

  typecheck:
    # Honors the @ts-check pragmas. typescript and @types/node install ephemerally for this job only,
    # pinned by hand because dependabot has no npm ecosystem here and there's no manifest to read.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts typescript@7.0.2 @types/node@26.6.5
      - run: node_modules/.bin/tsc -p tsconfig.ci.json

  plugin-validate:
    # The host's own strict validator over both manifests, so a check Claude Code tightens fails
    # here before it fails someone's install. Then the plugin is installed from this checkout and its
    # config.mjs launched from outside it, with no secret or credential in any step, the way a user gets it.
    # The CLI pin is the one version those commands were tried on and moves by hand.
    # An unpinned global install has no lockfile, which is what zizmor's adhoc-packages audit flags.
    # --ignore-scripts stops every install script; Claude Code's only links its native binary, so that one is run by name.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install -g --ignore-scripts @anthropic-ai/claude-code@2.1.318 # zizmor: ignore[adhoc-packages]
      - run: npm explore -g @anthropic-ai/claude-code -- node install.cjs
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict .claude-plugin/plugin.json
      - run: claude plugin marketplace add ./
      - run: claude plugin install cadence@cadence
      - name: Launch the installed plugin from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          INSTALL="$(claude plugin list --json | node -e "const rows = JSON.parse(require('fs').readFileSync(0, 'utf8')); const row = rows.find((r) => r.id === 'cadence@cadence'); if (!row) { console.error('cadence@cadence is not installed'); process.exit(1); } process.stdout.write(row.installPath);")"
          OUT="$(node "$INSTALL/cadence-core/bin/config.mjs" get workflow.plan_check)"
          echo "$OUT"
          echo "$OUT" | node -e "process.exit(JSON.parse(require('fs').readFileSync(0, 'utf8')).ok === true ? 0 : 1)"
