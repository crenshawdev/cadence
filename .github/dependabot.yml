# Version updates only; security updates are a repository setting, not this file.
# The seven-day wait gives a bad release a week to get pulled before we take it.
version: 2
updates:
  # Bumps the action pins in the workflows, SHA and version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
