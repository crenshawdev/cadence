<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-label="Command to agent map: cad-context spawns one assumptions analyzer, cad-plan spawns one planner and one plan checker, cad-execute spawns one executor per plan, cad-verify spawns one verifier, and the review seam fire spawns one subagent plus any cross-model reviewers.">

  <style>
    svg        { color: #15181E; background: #FFFFFF;
                 font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .bg        { fill: #FFFFFF; }
    .box       { fill: #FFFFFF; stroke: currentColor; stroke-width: 1.4; }
    .box-danger{ stroke: #A3331F; }
    .box-cmd   { fill: #FFFFFF; stroke: #2B43B2; stroke-width: 1.6; }
    .box-soft  { fill: #E8ECF2; stroke: #D3D9E1; stroke-width: 1; }
    .box-seam  { fill: none; stroke: #8B5A03; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .gate      { fill: none; stroke: #8B5A03; stroke-width: 1.6; }
    .edge      { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .edge-alt  { fill: none; stroke: #A3331F; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .edge-loop { fill: none; stroke: #2B43B2; stroke-width: 1.7; }
    .edge-thin { fill: none; stroke: #5A6170; stroke-width: 1; stroke-dasharray: 2 4; }
    .lbl       { font-size: 13px; fill: currentColor; }
    .lbl-sm    { font-size: 11px; fill: currentColor; }
    .lbl-mut   { font-size: 10.5px; fill: #5A6170; }
    .lbl-alt   { font-size: 10.5px; fill: #A3331F; }
    .lbl-gate  { font-size: 11.5px; fill: #8B5A03; }
    .lbl-acc   { font-size: 11px; fill: #2B43B2; }
    .head      { fill: currentColor; }
    .head-alt  { fill: #A3331F; }
    .head-loop { fill: #2B43B2; }
    @media (prefers-color-scheme: dark) {
      svg        { color: #E2E6EC; background: #151920; }
      .bg        { fill: #151920; }
      .box       { fill: #151920; }
      .box-danger{ stroke: #e2705c; }
      .box-cmd   { fill: #151920; stroke: #8698F6; }
      .box-soft  { fill: #1B2029; stroke: #292F39; }
      .box-seam  { stroke: #e2a64d; }
      .gate      { stroke: #e2a64d; }
      .edge-alt  { stroke: #e2705c; }
      .edge-loop { stroke: #8698F6; }
      .edge-thin { stroke: #929BAA; }
      .lbl-mut   { fill: #929BAA; }
      .lbl-alt   { fill: #e2705c; }
      .lbl-gate  { fill: #e2a64d; }
      .lbl-acc   { fill: #8698F6; }
      .head-alt  { fill: #e2705c; }
      .head-loop { fill: #8698F6; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <polygon class="head" points="0,0 10,4 0,8" />
    </marker>
    <marker id="ah-alt" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <polygon class="head-alt" points="0,0 10,4 0,8" />
    </marker>
    <marker id="ah-loop" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <polygon class="head-loop" points="0,0 10,4 0,8" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="510" />
ers.">

        <rect class="box-cmd" x="40" y="40" width="210" height="44" rx="6" />
        <text class="lbl-sm" x="56" y="67" text-anchor="start">/cad-context</text>
        <rect class="box-cmd" x="40" y="118" width="210" height="44" rx="6" />
        <text class="lbl-sm" x="56" y="145" text-anchor="start">/cad-plan</text>
        <rect class="box-cmd" x="40" y="238" width="210" height="44" rx="6" />
        <text class="lbl-sm" x="56" y="265" text-anchor="start">/cad-execute</text>
        <rect class="box-cmd" x="40" y="338" width="210" height="44" rx="6" />
        <text class="lbl-sm" x="56" y="365" text-anchor="start">/cad-verify --deep</text>
        <rect class="box-seam" x="40" y="414" width="210" height="44" rx="6" />
        <text class="lbl-sm" x="56" y="441" text-anchor="start">fire(trigger)</text>

        <rect class="box" x="580" y="40" width="300" height="44" rx="6" />
        <text class="lbl-sm" x="596" y="67" text-anchor="start">cad-assumptions-analyzer</text>
        <rect class="box" x="580" y="108" width="300" height="44" rx="6" />
        <text class="lbl-sm" x="596" y="135" text-anchor="start">cad-planner</text>
        <rect class="box" x="580" y="168" width="300" height="44" rx="6" />
        <text class="lbl-sm" x="596" y="195" text-anchor="start">cad-plan-checker</text>
        <rect class="box" x="580" y="238" width="300" height="44" rx="6" />
        <text class="lbl-sm" x="596" y="265" text-anchor="start">cad-executor</text>
        <rect class="box" x="580" y="338" width="300" height="44" rx="6" />
        <text class="lbl-sm" x="596" y="365" text-anchor="start">cad-verifier</text>
        <rect class="box" x="580" y="414" width="300" height="44" rx="6" />
        <text class="lbl-sm" x="596" y="441" text-anchor="start">cad-reviewer</text>

        <line class="edge" x1="250" y1="62"  x2="574" y2="62"  marker-end="url(#ah)" />
        <text class="lbl-mut" x="412" y="54" text-anchor="middle">one per phase</text>

        <line class="edge" x1="250" y1="140" x2="574" y2="130" marker-end="url(#ah)" />
        <text class="lbl-mut" x="412" y="127" text-anchor="middle">one, plus at most one fresh revision</text>

        <line class="edge" x1="250" y1="140" x2="574" y2="190" marker-end="url(#ah)" />
        <text class="lbl-mut" x="470" y="207" text-anchor="middle">one, plus at most one re-check</text>

        <line class="edge" x1="250" y1="260" x2="574" y2="260" marker-end="url(#ah)" />
        <text class="lbl-mut" x="412" y="252" text-anchor="middle">one per PLAN, batched in worktrees when safe</text>

        <line class="edge" x1="250" y1="360" x2="574" y2="360" marker-end="url(#ah)" />
        <text class="lbl-mut" x="412" y="352" text-anchor="middle">one, first UAT session only</text>

        <line class="edge" x1="250" y1="436" x2="574" y2="436" marker-end="url(#ah)" />
        <text class="lbl-mut" x="412" y="412" text-anchor="middle">one subagent plus every cross-model</text>
        <text class="lbl-mut" x="412" y="426" text-anchor="middle">voice, all in one message</text>

        <text class="lbl-mut" x="40" y="482" text-anchor="start">fire(trigger) is called by /cad-plan, /cad-execute, /cad-verify, /cad-land and /cad-task. It is a seam, not a command</text>
        <text class="lbl-mut" x="40" y="500" text-anchor="start">No agent spawns another agent. An executor never calls its own reviewer; second opinions arrive only through a trigger.</text>
</svg>
