<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" width="1120" height="250" role="img" aria-label="The risk floor: the phase plan's declared file list is matched against eight risk surfaces; a match raises the stakes level to critical for that phase, no match leaves the project baseline, and either way the result feeds the cell lookup.">

  <style>
    svg        { color: #15181E; background: #FFFFFF;
                 font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .bg        { fill: #FFFFFF; }
    .box       { fill: #FFFFFF; stroke: currentColor; stroke-width: 1.4; }
    .box-danger{ stroke: #A3331F; }
    .box-cmd   { fill: #FFFFFF; stroke: #2B43B2; stroke-width: 1.6; }
    .box-soft  { fill: #E8ECF2; stroke: #D3D9E1; stroke-width: 1; }
    .box-seam  { fill: none; stroke: #8B5A03; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .gate      { fill: none; stroke: #8B5A03; stroke-width: 1.6; }
    .edge      { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .edge-alt  { fill: none; stroke: #A3331F; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .edge-loop { fill: none; stroke: #2B43B2; stroke-width: 1.7; }
    .edge-thin { fill: none; stroke: #5A6170; stroke-width: 1; stroke-dasharray: 2 4; }
    .lbl       { font-size: 13px; fill: currentColor; }
    .lbl-sm    { font-size: 11px; fill: currentColor; }
    .lbl-mut   { font-size: 10.5px; fill: #5A6170; }
    .lbl-alt   { font-size: 10.5px; fill: #A3331F; }
    .lbl-gate  { font-size: 11.5px; fill: #8B5A03; }
    .lbl-acc   { font-size: 11px; fill: #2B43B2; }
    .head      { fill: currentColor; }
    .head-alt  { fill: #A3331F; }
    .head-loop { fill: #2B43B2; }
    @media (prefers-color-scheme: dark) {
      svg        { color: #E2E6EC; background: #151920; }
      .bg        { fill: #151920; }
      .box       { fill: #151920; }
      .box-danger{ stroke: #e2705c; }
      .box-cmd   { fill: #151920; stroke: #8698F6; }
      .box-soft  { fill: #1B2029; stroke: #292F39; }
      .box-seam  { stroke: #e2a64d; }
      .gate      { stroke: #e2a64d; }
      .edge-alt  { stroke: #e2705c; }
      .edge-loop { stroke: #8698F6; }
      .edge-thin { stroke: #929BAA; }
      .lbl-mut   { fill: #929BAA; }
      .lbl-alt   { fill: #e2705c; }
      .lbl-gate  { fill: #e2a64d; }
      .lbl-acc   { fill: #8698F6; }
      .head-alt  { fill: #e2705c; }
      .head-loop { fill: #8698F6; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <polygon class="head" points="0,0 10,4 0,8" />
    </marker>
    <marker id="ah-alt" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <polygon class="head-alt" points="0,0 10,4 0,8" />
    </marker>
    <marker id="ah-loop" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <polygon class="head-loop" points="0,0 10,4 0,8" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="250" />
kup.">

        <rect class="box" x="30" y="70" width="230" height="70" rx="6" />
        <text class="lbl-sm" x="46" y="94" text-anchor="start">PLAN.md frontmatter</text>
        <text class="lbl-sm" x="46" y="112" text-anchor="start">files:</text>
        <text class="lbl-mut" x="46" y="130" text-anchor="start">the paths this phase touches</text>

        <line class="edge" x1="260" y1="105" x2="304" y2="105" marker-end="url(#ah)" />

        <polygon class="gate" points="308,105 430,53 552,105 430,157" />
        <text class="lbl-gate" x="430" y="101" text-anchor="middle">matches a risk</text>
        <text class="lbl-gate" x="430" y="116" text-anchor="middle">surface?</text>

        <polyline class="edge" points="552,105 590,105 590,52 634,52" marker-end="url(#ah)" />
        <text class="lbl-sm" x="582" y="78" text-anchor="end">yes</text>

        <polyline class="edge" points="552,105 590,105 590,158 634,158" marker-end="url(#ah)" />
        <text class="lbl-sm" x="582" y="140" text-anchor="end">no</text>

        <rect class="box box-danger" x="640" y="24" width="250" height="56" rx="6" />
        <text class="lbl-sm" x="765" y="48" text-anchor="middle">stakes raised to critical</text>
        <text class="lbl-mut" x="765" y="65" text-anchor="middle">for this phase only</text>

        <rect class="box-soft" x="640" y="130" width="250" height="56" rx="6" />
        <text class="lbl-sm" x="765" y="154" text-anchor="middle">stakes stays at the</text>
        <text class="lbl-sm" x="765" y="171" text-anchor="middle">project baseline</text>

        <polyline class="edge" points="890,52 915,52 915,98 934,98" marker-end="url(#ah)" />
        <polyline class="edge" points="890,158 915,158 915,112 934,112" marker-end="url(#ah)" />

        <rect class="box" x="940" y="70" width="160" height="70" rx="6" />
        <text class="lbl-sm" x="1020" y="94" text-anchor="middle">cell lookup</text>
        <text class="lbl-mut" x="1020" y="112" text-anchor="middle">(stakes × role)</text>
        <text class="lbl-mut" x="1020" y="130" text-anchor="middle">model + start rung</text>

        <text class="lbl-mut" x="30" y="212" text-anchor="start">the eight surfaces</text>
        <text class="lbl-sm" x="30" y="230" text-anchor="start">auth · migrations · billing · concurrency · destructive · secrets · api_contract · untrusted_input</text>
</svg>
